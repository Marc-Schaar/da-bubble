@for (emoji of emojis(); track $index) {
  <button
    appButton
    variant="icon"
    class="btn-secundary circle"
    [ngClass]="{ 'bg-purple': isSelected()(emoji) }"
    [attr.aria-label]="'Reaktion ' + emoji"
    [attr.aria-pressed]="isSelected()(emoji)"
    (click)="pick.emit(emoji)"
  >
    {{ emoji }}
  </button>
}
