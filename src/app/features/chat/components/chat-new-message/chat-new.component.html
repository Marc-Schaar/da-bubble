@if (this.navigationService.isMobile()) {
  <app-chat-header></app-chat-header>
}
<div class="page-wrapper">
  <section>
    <header class="header gap-20">
      <h1 class="newText">Neue Nachricht</h1>

      <app-input
        [(ngModel)]="input"
        (input)="searchService.observeInput(input, 'newMessage')"
        (keydown)="onSearchKeydown($event)"
        type="text"
        placeholder="An: #Channel, oder @jemand oder E-Mail-Adresse"
        ariaLabel="An: #Channel, oder @jemand oder E-Mail-Adresse"
        role="combobox"
        [ariaExpanded]="searchService.getNewListBoolean()"
        [ariaControls]="listboxId"
        [ariaActivedescendant]="activeDescendantId()"
      />
    </header>

    @if (searchService.getNewListBoolean()) {
      <div class="tag-container">
        <app-search-result [(input)]="input" [listboxId]="listboxId" (currentReceiver)="setReceiver($event)"></app-search-result>
      </div>
    }

    <footer class="card-footer">
      <app-textarea-template
        [placeholderText]="'Starte eine Nachricht an: ' + (getReceiverName() || '...')"
        [disabled]="!getReceiverType()"
        (send)="onSend($event)"
      ></app-textarea-template>
    </footer>
  </section>
</div>
