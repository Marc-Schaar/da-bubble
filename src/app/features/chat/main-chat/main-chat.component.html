<a class="skip-link" href="#main-content">Zum Hauptinhalt springen</a>

@if (!navigationService.isMobile()) {
  <app-header>
    <app-header-search headerSearch></app-header-search>
    <app-header-user-menu headerActions></app-header-user-menu>
  </app-header>
}

<div class="main-chat-container" (click)="closeAll()">
  <mat-drawer-container class="chat-content" autosize>
    @if (!navigationService.isMobile()) {
      <mat-drawer
        #drawerContactbar
        mode="side"
        [opened]="barOpen()"
        (openedChange)="barOpen.set($event)"
        class="contactbar-container"
        role="navigation"
        aria-label="Workspace-Navigation"
      >
        <app-contactbar></app-contactbar>
      </mat-drawer>
    }

    <main id="main-content" tabindex="-1" class="component-area">
      @if (navigationService.isMobile()) {
        @if (navigationService.isMainChat()) {
          <app-contactbar></app-contactbar>
        } @else {
          <router-outlet></router-outlet>
        }
      } @else {
        <router-outlet></router-outlet>
      }
    </main>

    <mat-drawer
      #drawer
      position="end"
      class="thread-container"
      [mode]="navigationService.isMobile() ? 'over' : 'side'"
      [opened]="navigationService.isThreadOpen()"
      (closedStart)="navigationService.toggleThread('close')"
      role="complementary"
      aria-label="Thread"
    >
      <app-thread></app-thread>
    </mat-drawer>
  </mat-drawer-container>
</div>

@if (!navigationService.isMobile()) {
  <aside class="navbar-toggle-container">
    <button type="button" (click)="toogleContactbar()" class="navbar-toggle-btn">
      <span>Workspacemenü {{ barOpen() ? "öffnen" : "schließen" }}</span>
      <span [ngStyle]="{ transform: barOpen() ? 'rotate(90deg)' : 'rotate(-90deg)' }" class="material-symbols-outlined">
        left_panel_open
      </span>
    </button>
  </aside>
}
