<main class="form">
  <header>
    <h1>Anmeldung</h1>
    <p>Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.</p>
  </header>

  <form class="input-container" [formGroup]="loginForm" (ngSubmit)="onSubmit()" id="loginForm">
    <div class="full-width">
      <app-input
        appearance="filled"
        icon="email"
        type="email"
        name="email"
        formControlName="email"
        placeholder="beispielname@email.com"
        ariaLabel="E-Mail-Adresse"
        [invalid]="!!getEmailError()"
        [errorMessage]="getEmailError()"
      />
    </div>

    <div class="full-width">
      <app-input
        appearance="filled"
        icon="lock"
        type="password"
        name="password"
        formControlName="password"
        placeholder="Passwort"
        ariaLabel="Passwort"
        [invalid]="!!getPasswordError()"
        [errorMessage]="getPasswordError()"
      />
    </div>
  </form>

  <a class="link" routerLink="/forgotpassword">Passwort vergessen?</a>

  <div class="divider">ODER</div>

  <section class="btn-container">
    <button appButton variant="plain" class="btn btn-google" type="button" (click)="signinwithgoogle()">
      <img src="img/Google.png" alt="Google Logo" />
      Anmelden mit Google
    </button>
    <div class="full-width justify-center gap-20 flex-wrap">
      <button appButton variant="plain" type="submit" class="btn" [disabled]="this.authService.isLoading" form="loginForm">Anmelden</button
      ><button appButton variant="plain" type="button" class="btn" [disabled]="this.authService.isLoading" (click)="guestLogin()">Gäste-Login</button>
    </div>
  </section>
</main>
