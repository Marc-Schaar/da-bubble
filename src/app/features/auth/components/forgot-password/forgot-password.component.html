<div class="borders">
  <app-header>
    <app-header-user-menu headerActions></app-header-user-menu>
  </app-header>
  <div class="forgotpassword">
    <div class="content">
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <div>
          <app-button variant="icon" type="button" ariaLabel="Zurück zum Login" routerLink="/">
            <img src="img/arrow_back.png" alt="" />
          </app-button>
          <div>
            <div>
              <h1>Passwort zurücksetzen</h1>
              <span>Bitte geben Sie Ihre E-Mail-Adresse ein.</span>
            </div>
          </div>
        </div>
        <div class="box">
          <app-input
            formControlName="email"
            type="email"
            placeholder="beispielname@email.com"
            ariaLabel="E-Mail-Adresse"
            [invalid]="!!getEmailError()"
            [errorMessage]="getEmailError()"
          />
        </div>
        <div class="errorbox">
          @if (submitted) {
            <div class="success">
              <span>Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</span>
            </div>
          }
        </div>

        <div class="btnborder">
          <app-button variant="primary" type="submit" [disabled]="forgotPasswordForm.invalid">E-Mail senden</app-button>
        </div>
      </form>
    </div>
  </div>
  <div [class.active]="isOverlayActive" class="overlay"></div>
  <app-footer></app-footer>
</div>
