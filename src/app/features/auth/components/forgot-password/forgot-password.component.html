<div class="borders">
  <app-header></app-header>
  <div class="forgotpassword">
    <div class="content">
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <div>
          <button appButton variant="icon" class="hover-to-dark-purple" type="button" aria-label="Zurück zum Login" routerLink="/">
            <img src="img/arrow_back.png" alt="" />
          </button>
          <div>
            <div>
              <h1>Passwort zurücksetzen</h1>
              <span>Bitte geben Sie Ihre E-Mail-Adresse ein.</span>
            </div>
          </div>
        </div>
        <div class="box">
          <div class="emailinput">
            <input
              appInput
              #emailField="appInput"
              [invalid]="!!getEmailError()"
              formControlName="email"
              type="email"
              placeholder="beispielname@email.com"
            />
          </div>
          <app-field-error [id]="emailField.id + '-error'" [message]="getEmailError()" />
        </div>
        <div class="errorbox">
          @if (submitted) {
            <div class="success">
              <span>Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</span>
            </div>
          }
        </div>

        <div class="btnborder">
          <button appButton variant="plain" type="submit" [disabled]="forgotPasswordForm.invalid" class="submitbutton">E-Mail senden</button>
        </div>
      </form>
    </div>
  </div>
  <div [class.active]="isOverlayActive" class="overlay"></div>
  <app-footer></app-footer>
</div>
