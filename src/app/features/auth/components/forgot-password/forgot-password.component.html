<form class="password-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
  <header class="header-row">
    <app-button variant="icon" type="button" ariaLabel="Zurück zum Login" routerLink="/">
      <img src="img/arrow_back.png" alt="" />
    </app-button>
    <h1>Passwort zurücksetzen</h1>
  </header>

  <p>Bitte geben Sie Ihre E-Mail-Adresse ein.</p>

  <app-input
    formControlName="email"
    type="email"
    placeholder="beispielname@email.com"
    appearance="filled"
    icon="email"
    ariaLabel="E-Mail-Adresse"
    [invalid]="!!getEmailError()"
    [errorMessage]="getEmailError()"
  />

  <p class="sub-text">Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</p>

  <app-button class="form-button" variant="primary" type="submit" [disabled]="forgotPasswordForm.invalid" [loading]="isSubmitting"
    >E-Mail senden</app-button
  >
</form>
