<div class="borders">
  <app-header></app-header>
  <div class="forgotpassword">
    <div class="content">
      @if (isCodeValid) {
        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
          <div>
            <button appButton variant="icon" class="hover-to-dark-purple" type="button" aria-label="Zurück zum Chat" routerLink="/main">
              <img src="img/arrow_back.png" alt="" />
            </button>
            <div>
              <div>
                <h1>Passwort zurücksetzen</h1>
              </div>
            </div>
          </div>
          <div class="box">
            <div class="emailinput">
              <input
                appInput
                #passwordField="appInput"
                [invalid]="!!getPasswordError()"
                formControlName="password"
                type="password"
                placeholder="Neues Passwort"
              />
            </div>
            <app-field-error [id]="passwordField.id + '-error'" [message]="getPasswordError()" />
            <div>
              <div class="emailinput">
                <input
                  appInput
                  #passwordConfirmField="appInput"
                  [invalid]="!!getPasswordConfirmError()"
                  formControlName="passwordConfirm"
                  type="password"
                  placeholder="Neues Kennwort bestätigen"
                />
              </div>
              <app-field-error [id]="passwordConfirmField.id + '-error'" [message]="getPasswordConfirmError()" />
            </div>
            <div class="btnborder">
              <button appButton variant="plain" type="submit" [disabled]="resetPasswordForm.invalid" class="submitbutton">Passwort ändern</button>
            </div>
          </div>
        </form>
      } @else {
        <div class="box">
          <span class="error">Dieser Link zum Zurücksetzen des Passworts ist ungültig oder abgelaufen.</span>
          <div class="btnborder">
            <a routerLink="/forgotpassword" class="submitbutton">Neuen Link anfordern</a>
          </div>
        </div>
      }
    </div>
  </div>
  <div [class.active]="isOverlayActive" class="overlay"></div>
  <app-footer></app-footer>
</div>
