<main class="form">
  <header>
    <h1>Anmeldung</h1>
    <p>Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.</p>
  </header>

  <form class="input-container" [formGroup]="loginForm" (ngSubmit)="onSubmit()" id="loginForm">
    <div class="full-width">
      <app-input
        appearance="filled"
        icon="email"
        type="email"
        name="email"
        formControlName="email"
        placeholder="beispielname@email.com"
        ariaLabel="E-Mail-Adresse"
        [invalid]="!!getEmailError()"
        [errorMessage]="getEmailError()"
      />
    </div>

    <div class="full-width">
      <app-input
        appearance="filled"
        icon="lock"
        type="password"
        name="password"
        formControlName="password"
        placeholder="Passwort"
        ariaLabel="Passwort"
        [invalid]="!!getPasswordError()"
        [errorMessage]="getPasswordError()"
      />
    </div>
  </form>

  <a class="link" routerLink="/forgot-password">Passwort vergessen?</a>

  <div class="divider">ODER</div>

  <section class="btn-container">
    <app-button
      variant="secondary"
      class="btn-google"
      type="button"
      [disabled]="this.authService.isLoading"
      [loading]="this.authService.isLoading"
      (click)="signinwithgoogle()"
    >
      <img src="img/Google.png" alt="Google Logo" />
      Anmelden mit Google
    </app-button>
    <div class="full-width justify-center gap-20 flex-wrap">
      <app-button
        variant="primary"
        type="submit"
        [disabled]="this.authService.isLoading"
        [loading]="this.authService.isLoading"
        form="loginForm"
        >Anmelden</app-button
      >
      <app-button
        variant="secondary"
        type="button"
        [disabled]="this.authService.isLoading"
        [loading]="this.authService.isLoading"
        (click)="guestLogin()"
        >Gäste-Login</app-button
      >
    </div>
  </section>
</main>
