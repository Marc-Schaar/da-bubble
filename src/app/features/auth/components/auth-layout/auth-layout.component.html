<main>
  <app-header>
    @if (!navigationService.isMobile()) {
      <app-sign-up-box headerActions></app-sign-up-box>
    }
  </app-header>

  <section class="auth-card">
    <router-outlet />
  </section>

  @if (navigationService.isMobile() && !navigationService.isSignUpPage()) {
    <app-sign-up-box></app-sign-up-box>
  }

  <app-footer></app-footer>

  @if (showIntro()) {
    <app-intro></app-intro>
  }
</main>
