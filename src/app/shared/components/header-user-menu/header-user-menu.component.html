<app-button
  variant="plain"
  class="menu__triger__btn"
  (click)="onOpenMenu()"
  [matMenuTriggerFor]="!navigationService.isMobile() ? beforeMenu : null"
>
  <span>{{ authService.currentUser()?.displayName }}</span>
  <app-profile-status
    [photoUrl]="authService.currentUser()?.photoUrl"
    [online]="authService.currentUser()?.online ?? false"
  ></app-profile-status>
  @if (!navigationService.isMobile()) {
    <mat-icon>keyboard_arrow_down</mat-icon>
  }
</app-button>

<mat-menu class="menu-box" #beforeMenu="matMenu" xPosition="before" (closed)="onMenuClosed()">
  <button type="button" (click)="showProfile()" class="menu-box-btn" mat-menu-item (click)="$event.stopPropagation()">Profil</button>
  <button type="button" (click)="signOut()" class="menu-box-btn" mat-menu-item>Log out</button>
</mat-menu>
