<div class="profile-main-cont" (click)="handleClick($event)">
  <app-dialog-header title="Profil" (closed)="closeMenu()"></app-dialog-header>

  <div (click)="modifyInfos ? openAvatarSelection() : null" class="picture-cont">
    <img [src]="pendingPhotoUrl ?? user()?.photoUrl" alt="" />
  </div>

  @if (!modifyInfos) {
    <div class="discription-cont">
      <div class="info-edit">
        <div class="name">{{ user()?.displayName }}</div>
        <div class="tooltip-cont">
          <app-button variant="plain" class="edit-btn" (click)="modify()">
            @if (navigationService.isMobile()) {
              <mat-icon>edit</mat-icon>
            } @else {
              Bearbeiten
            }
          </app-button>
          <span class="tooltip guest-msg-pos">Zugang für Gäste gesperrt</span>
        </div>
      </div>
      <div class="status-cont">
        <div class="circle"></div>
        <div class="status">Aktiv</div>
      </div>
    </div>

    <div class="contact-cont">
      <div>
        <div class="envelope"><img src="img/mail.png" alt="" /></div>
        <div class="contact">
          <p class="email">Email-Adresse</p>
          <div class="email-route">{{ user()?.email }}</div>
        </div>
      </div>
    </div>
  } @else {
    <div class="section">
      <div>
        <div>
          <div><img src="img/account_circle.png" alt="" /></div>
          <div><span>Vollständiger Name</span></div>
        </div>

        <div><app-input ariaLabel="Vollständiger Name" [(ngModel)]="newName" type="text" /></div>
      </div>
      <div class="btn-borders">
        <div>
          <app-button variant="outline" (click)="cancel()">Abbrechen</app-button
          ><app-button variant="primary" (click)="saveChanges()">Speichern</app-button>
        </div>
      </div>
    </div>
  }
</div>
