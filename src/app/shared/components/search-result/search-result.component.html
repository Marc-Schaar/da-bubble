<ul [id]="listboxId()" role="listbox">
  @for (element of searchService.getCurrentList(); track $index) {
    <li
      [id]="listboxId() + '-option-' + $index"
      role="option"
      [attr.aria-selected]="$index === searchService.getHighlightedIndex()"
      [class.highlighted]="$index === searchService.getHighlightedIndex()"
    >
      <button type="button" class="result-btn" tabindex="-1" (click)="handleClick(element)">
        @if (isChannel(element)) {
          <mat-icon>tag</mat-icon>
          {{ element.name }}
        } @else if (isUser(element)) {
          <app-user-list-item [user]="element"></app-user-list-item>
        }
      </button>
    </li>
  } @empty {
    <li class="empty-state" role="presentation">
      Kein
      @if (searchService.isChannel() === true) {
        Channel
      } @else if (searchService.isChannel() === false) {
        Nutzer
      } @else {
        Eintrag
      }
      gefunden
    </li>
  }
</ul>
