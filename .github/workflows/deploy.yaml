name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Generate environment files
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            defaultChannelId: 'allgemein',
            firebase: {
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
              databaseURL: '${{ secrets.FIREBASE_DATABASE_URL }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
            },
          };
          EOF
          cp src/environments/environment.prod.ts src/environments/environment.ts

      - name: Install and Build
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Prepare Server Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "SSH Verbindung erfolgreich!"
            mkdir -p /var/www/da-bubble.marc-schaar.com
            chown -R $USER:$USER /var/www/da-bubble.marc-schaar.com
            rm -rf /var/www/da-bubble.marc-schaar.com/*

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/da-bubble/browser/*"
          target: "/var/www/da-bubble.marc-schaar.com"
          strip_components: 3

      - name: Restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /usr/bin/sudo /usr/bin/systemctl restart nginx
