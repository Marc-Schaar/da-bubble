name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Generate environment files
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            useEmulators: false,
            defaultChannelId: 'allgemein',
            firebase: {
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
              databaseURL: '${{ secrets.FIREBASE_DATABASE_URL }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
            },
          };
          EOF
          cp src/environments/environment.prod.ts src/environments/environment.ts

      - name: Install and Build
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # rsync --delete statt "rm -rf + scp": Der Webroot ist nie leer, und ein
      # Abbruch laesst die alte Version stehen. Kein sudo und kein nginx-Neustart
      # noetig: nginx liefert die neuen Dateien sofort aus.
      - name: Deploy to webroot
        env:
          HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -uo pipefail
          SSH_OPTS="ssh -i $HOME/.ssh/id_deploy -o ConnectTimeout=15 -o BatchMode=yes"
          for attempt in 1 2 3 4 5; do
            if rsync -az --delete -e "$SSH_OPTS" \
                 dist/da-bubble/browser/ \
                 "$DEPLOY_USER@$HOST:/var/www/da-bubble.marc-schaar.com/"; then
              echo "Deploy erfolgreich (Versuch $attempt)"
              exit 0
            fi
            echo "Versuch $attempt fehlgeschlagen, warte 30s"
            sleep 30
          done
          echo "Deploy nach 5 Versuchen fehlgeschlagen"
          exit 1
